---
layout: default
title: Blog
lang: en
---

<div class="container">
    <h1 class="blog-page-title">Blog</h1>

    {% assign posts = site.posts | where: "lang", "en" %}
    {% if posts.size > 0 %}
    {% for post in posts %}
    {% include post-card.html post=post %}
    {% endfor %}
    {% else %}
    <p class="empty-note">No posts yet — coming soon. 🚀</p>
    {% endif %}
</div>
