---
layout: default
---

<article class="post-page">
    {% if page.lang == "zh" %}
    <a href="/zh/blog/" class="back-link">← 回到部落格</a>
    {% else %}
    <a href="/blog/" class="back-link">← Back to Blog</a>
    {% endif %}
    <h1>{{ page.title }}</h1>
    <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y"
        }}</time>
    <div class="post-content">
        {{ content }}
    </div>
</article>
