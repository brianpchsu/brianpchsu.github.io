title: Brian Hsu
description: Staff Software Engineer in Silicon Valley — career, AI engineering, and community.
lang: en
url: "https://brianhsu.dev"
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:title/

# Exclude files from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - templates

# Collections
collections:
  posts:
    output: true

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      lang: "en"

# Plugins (GitHub Pages supported)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
