---
layout: default
title: 部落格
lang: zh
---

<div class="container">
    <h1 class="blog-page-title">部落格</h1>

    {% assign posts = site.posts | where: "lang", "zh" %}
    {% if posts.size > 0 %}
    {% for post in posts %}
    {% include post-card.html post=post %}
    {% endfor %}
    {% else %}
    <p class="empty-note">尚未發布任何文章，敬請期待！🚀</p>
    {% endif %}
</div>
